name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  install:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: node:22
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - if: runner.os == 'Linux'
        run: docker pull node:22
      - run: python -m unittest discover -s tests -v
        env:
          GRAFT_TEST_TARGET: ${{ matrix.target }}
          GRAFT_API_KEY: dummy-marker-for-child-isolation
      - run: enntity-graft --help
