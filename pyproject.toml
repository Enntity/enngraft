[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "enngraft"
version = "0.1.0"
description = "Model-assisted installation and repair for source packages"
requires-python = ">=3.9"
license = {text = "MIT"}
readme = "README.md"

[project.urls]
Repository = "https://github.com/Enntity/enngraft"
Documentation = "https://github.com/Enntity/enngraft/blob/main/docs/integration.md"
Issues = "https://github.com/Enntity/enngraft/issues"

[project.scripts]
enngraft = "enngraft.__main__:main"

[tool.setuptools]
packages = ["enngraft"]
